<style>
/* Layout: Kopfleiste mit Navigation, darunter eine Arbeitsfläche; Karten nur für Einsatzblöcke. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e3e8ee;
  --line: #c9d1da;
  --fg: #15212c;
  --muted: #566573;
  --accent: #d94a12;
  --accent-ink: #ffffff;
  --blau: #1f4e8c;
  --sk1: #c62828;
  --sk2: #d39a00;
  --sk3: #2e7d32;
  --plate: #ffffff;
  --plate-ink: #111111;
  --map-ground: #dfe7d6;
  --map-road: #f6f3ea;
  --map-build: #c8cdd3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #17212b; --surface-2: #1f2c38; --line: #2e3e4d; --fg: #e5ebf0; --muted: #9aa9b6;
    --accent: #ff6a33; --accent-ink: #1a0b03; --blau: #7fb0ff; --sk1: #ff6b6b; --sk2: #ffcf4d; --sk3: #6fd47a;
    --plate: #e9edf0; --plate-ink: #111111; --map-ground: #1d2a22; --map-road: #2d3a44; --map-build: #33414d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #17212b; --surface-2: #1f2c38; --line: #2e3e4d; --fg: #e5ebf0; --muted: #9aa9b6;
  --accent: #ff6a33; --accent-ink: #1a0b03; --blau: #7fb0ff; --sk1: #ff6b6b; --sk2: #ffcf4d; --sk3: #6fd47a;
  --plate: #e9edf0; --plate-ink: #111111; --map-ground: #1d2a22; --map-road: #2d3a44; --map-build: #33414d; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--fg); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; letter-spacing: .01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; max-width: 68ch; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num, td, .mono { font-variant-numeric: tabular-nums; }

.kopf { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kopf-innen { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding-block: 10px; }
.marke { display: flex; align-items: baseline; gap: 10px; }
.marke b { font-family: var(--f-display); font-size: 1.5rem; letter-spacing: .02em; text-transform: uppercase; }
.marke span { font-size: .82rem; opacity: .75; }
.marke i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); align-self: center; }
nav { display: flex; flex-wrap: wrap; gap: 2px; margin-left: auto; }
nav a { color: inherit; text-decoration: none; font-family: var(--f-display); font-size: 1.05rem; letter-spacing: .03em; text-transform: uppercase; padding: 6px 10px; border-radius: var(--r); opacity: .78; }
nav a:hover { opacity: 1; background: color-mix(in srgb, var(--bg) 12%, transparent); }
nav a[aria-current="page"] { opacity: 1; box-shadow: inset 0 -3px 0 var(--accent); border-radius: 0; }

.demo-band { background: repeating-linear-gradient(135deg, var(--accent) 0 14px, color-mix(in srgb, var(--accent) 80%, var(--fg)) 14px 28px); color: var(--accent-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-band div { max-width: 1240px; margin: 0 auto; padding-block: 5px; font-size: .86rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.demo-band label { display: flex; gap: 6px; align-items: center; }
.demo-band input[type=range] { width: 160px; accent-color: var(--fg); }

main { max-width: 1240px; margin: 0 auto; padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.seitenkopf { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.seitenkopf p { color: var(--muted); }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .09em; font-size: .8rem; color: var(--muted); font-weight: 600; }

.flaeche { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.raster { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.raster > * { min-width: 0; }
.zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.zeile.ende { justify-content: flex-end; }
.leise { color: var(--muted); font-size: .9rem; }
.trenner { height: 1px; background: var(--line); }

.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 600; }
.knopf:hover { border-color: var(--fg); }
.knopf.haupt { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.knopf.haupt:hover { filter: brightness(1.06); }
.knopf.klein { padding: 4px 9px; font-size: .86rem; }
.knopf[disabled] { opacity: .5; cursor: not-allowed; }
.knopf.gross { font-family: var(--f-display); font-size: 1.6rem; letter-spacing: .04em; padding: 16px 10px; min-width: 110px; }
.knopf[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.feld { display: grid; gap: 4px; min-width: 0; }
.feld span { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
input[type=text], input[type=password], input[type=time], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; border-radius: var(--r); width: 100%; min-width: 0; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: .85rem; }
.code-eingabe { font-family: var(--f-mono); font-size: 2rem; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: 12px; max-width: 300px; }

/* Funkrufname und Kennzeichen */
.frn { font-family: var(--f-mono); font-weight: 600; font-size: .88rem; white-space: nowrap; }
.kz { display: inline-flex; align-items: stretch; border: 1.5px solid var(--plate-ink); border-radius: 3px; background: var(--plate); color: var(--plate-ink); font-family: var(--f-mono); font-size: .78rem; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.kz::before { content: "D"; background: #1f4ea8; color: #fff; font-size: .6rem; padding: 0 3px; display: flex; align-items: end; }
.kz b { padding: 0 5px; font-weight: 600; }
.typ { font-family: var(--f-display); font-weight: 700; font-size: .8rem; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
.typ.RTW { color: var(--accent); } .typ.KTW { color: var(--blau); } .typ.NEF { color: var(--sk1); }
.pille { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); }
.pille.gut { background: color-mix(in srgb, var(--sk3) 22%, transparent); color: var(--sk3); }
.pille.warn { background: color-mix(in srgb, var(--sk2) 25%, transparent); color: color-mix(in srgb, var(--sk2) 70%, var(--fg)); }
.pille.schlecht { background: color-mix(in srgb, var(--sk1) 20%, transparent); color: var(--sk1); }
.pille.akzent { background: var(--accent); color: var(--accent-ink); }

/* Tabellen */
.tabelle-box { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: .8rem; color: var(--muted); background: var(--surface-2); padding: 7px 10px; white-space: nowrap; }
td { padding: 6px 10px; border-top: 1px solid var(--line); vertical-align: top; }
tr.erste td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
tr.aus td { opacity: .5; }

/* Persönlicher Plan */
.ablauf { display: grid; gap: 12px; }
.block { display: grid; grid-template-columns: 92px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.block .zeit { font-family: var(--f-display); font-size: 1.35rem; line-height: 1; }
.block .zeit small { display: block; font-size: .85rem; color: var(--muted); margin-top: 4px; }
.block.erste { border-color: var(--accent); box-shadow: inset 5px 0 0 var(--accent); }
.block.pause { background: var(--surface-2); }
.block > div { min-width: 0; display: grid; gap: 6px; }
.alarm { font-family: var(--f-display); font-size: 1.1rem; }
.alarm b { color: var(--accent); }
@media (max-width: 480px) { .block { grid-template-columns: 1fr; gap: 8px; } }

.kennzahl { display: grid; gap: 2px; }
.kennzahl b { font-family: var(--f-display); font-size: 2rem; line-height: 1; }
.kennzahl span { color: var(--muted); font-size: .85rem; }
.balken { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.balken i { display: block; height: 100%; }

/* Lagekarte */
.lage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
@media (max-width: 900px) { .lage { grid-template-columns: 1fr; } }
.karte { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--map-ground); aspect-ratio: 16 / 10; max-width: 100%; touch-action: none; }
.karte svg { display: block; width: 100%; height: 100%; }
.karte .st-label { font-family: var(--f-display); font-weight: 700; font-size: 15px; fill: var(--fg); paint-order: stroke; stroke: var(--map-ground); stroke-width: 4px; }
.karte .klein-label { font-family: var(--f-mono); font-size: 9px; fill: var(--fg); }
.karte .zieh { cursor: grab; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.qr { background: #fff; padding: 12px; border-radius: var(--r); width: fit-content; }
.qr img, .qr canvas { display: block; }
.hinweis { border-left: 4px solid var(--sk2); background: color-mix(in srgb, var(--sk2) 12%, var(--surface)); padding: 10px 12px; border-radius: 0 var(--r) var(--r) 0; }
.hinweis.rot { border-left-color: var(--sk1); background: color-mix(in srgb, var(--sk1) 10%, var(--surface)); }
.hinweis.gruen { border-left-color: var(--sk3); background: color-mix(in srgb, var(--sk3) 12%, var(--surface)); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-family: var(--f-display); font-size: 1.02rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.ok-gross { font-family: var(--f-display); font-size: 2.2rem; color: var(--sk3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Wachenfarben, Kennung, Ankunft */
.wpunkt { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: 5px; vertical-align: -.05em; }
.kennung { background: var(--wf); color: var(--wt); border-radius: var(--r); padding: 12px 18px; display: grid; gap: 2px; text-align: center; min-width: 170px; }
.kennung small { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; font-weight: 700; opacity: .9; }
.kennung b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; letter-spacing: .02em; }
.ank-ok { border-color: var(--sk3); }
.sucher { position: relative; border-radius: var(--r); overflow: hidden; background: #000; max-width: 720px; aspect-ratio: 16 / 9; }
.sucher video { width: 100%; height: 100%; object-fit: cover; display: block; }
.sucher-rahmen { position: absolute; left: 10%; top: 39%; width: 80%; height: 22%; border: 3px solid var(--accent); border-radius: 6px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .45); }
.optionen { display: grid; gap: 10px; }
.option { text-align: left; display: grid; gap: 3px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer; position: relative; }
.option:hover { border-color: var(--fg); }
.option b { font-family: var(--f-display); font-size: 1.3rem; }
.option span { color: var(--muted); font-size: .9rem; }
.option em { justify-self: start; order: -1; font-style: normal; font-size: .75rem; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 1px 8px; border-radius: 999px; }
.option.empfohlen { border: 2px solid var(--accent); }
.option-gruppe { display: grid; gap: 6px; border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; }
.kz-feld { width: 140px !important; padding: 4px 6px !important; }
details summary { cursor: pointer; font-weight: 600; }
details[open] { display: grid; gap: 8px; }
label.knopf { position: relative; }

/* Kennungs-Zettel: Bildschirmvorschau und Druck */
.zettel-bogen { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.zettel { background: #fff; color: #111; border: 10px solid var(--wf); border-radius: 4px; aspect-ratio: 297 / 210; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; max-width: 100%; }
.zettel header { background: var(--wf); color: var(--wt); font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; font-size: 1rem; padding: 4px 10px 8px; display: flex; justify-content: space-between; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.zettel-kennung { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; display: grid; place-items: center; letter-spacing: .02em; white-space: nowrap; }
.zettel footer { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 8px 10px; font-size: .8rem; border-top: 2px solid var(--wf); }
.zettel-typ { background: var(--wf); color: var(--wt); font-family: var(--f-display); font-weight: 700; padding: 1px 8px; border-radius: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  body { background: #fff; }
  body::before, .kopf, .demo-band, .nicht-drucken, .toast { display: none !important; }
  main { padding: 0 !important; max-width: none; display: block; }
  .zettel-bogen { display: block; }
  .zettel { -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; page-break-inside: avoid; border-width: 8mm; width: 100%; height: 190mm; aspect-ratio: auto; margin: 0 0 0; break-after: page; page-break-after: always; }
  .zettel header { font-size: 22pt; padding: 2mm 5mm 4mm; }
  .zettel-kennung { font-size: 150pt; }
  .zettel footer { font-size: 16pt; padding: 4mm 5mm; border-top-width: 1.5mm; }
  .zettel-bogen.a5 .zettel { height: 92mm; border-width: 5mm; break-after: auto; page-break-after: auto; margin-bottom: 4mm; }
  .zettel-bogen.a5 .zettel:nth-child(2n) { break-after: page; page-break-after: always; margin-bottom: 0; }
  .zettel-bogen.a5 .zettel-kennung { font-size: 80pt; }
  .zettel-bogen.a5 .zettel header { font-size: 14pt; }
  .zettel-bogen.a5 .zettel footer { font-size: 11pt; }
}
</style>

<script>
/* SimTag Dienstplan – Kernlogik (Browser und Node). Keine Abhängigkeiten. */
(function (root) {
  'use strict';

  const TYPEN = ['RTW', 'KTW', 'NEF'];
  const CODE_ZEICHEN = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function neuerCode(vorhanden, zufall) {
    const r = zufall || Math.random;
    for (;;) {
      let c = '';
      for (let i = 0; i < 6; i++) c += CODE_ZEICHEN[Math.floor(r() * CODE_ZEICHEN.length)];
      if (!vorhanden.has(c)) { vorhanden.add(c); return c; }
    }
  }

  function uid(prefix) {
    return prefix + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }

  function zeitZuMin(t) { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); }
  function minZuZeit(m) {
    m = ((Math.round(m) % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }

  function standardEinstellungen() {
    return {
      titel: 'SimTag 2027',
      datum: '2027-06-26',
      ort: 'LAFP NRW, Schloß Holte-Stukenbrock',
      durchgaenge: [
        { id: 'D1', start: '08:00', ende: '10:00' },
        { id: 'D2', start: '10:15', ende: '12:15' },
        { id: 'D3', start: '13:00', ende: '14:45' },
        { id: 'D4', start: '15:15', ende: '17:00' }
      ],
      stationen: [
        { id: 'S1', name: 'Verkehrsunfall', kurz: 'VU', x: 0.22, y: 0.30, patienten: 10 },

      ],
      bereitstellung: { x: 0.50, y: 0.48 },

      ersteWelle: 3,          // die ersten n Fahrzeuge je Station zählen als ersteintreffend
      nefPosition: 4,         // NEF wird als n-tes Fahrzeug alarmiert
      alarmRaster: [0, 3, 3, 5, 8, 8, 10, 12, 12, 15, 15, 18, 18, 20, 22, 24],

  function leererZustand() {
    return { version: 1, einstellungen: standardEinstellungen(), personen: [], fahrzeuge: [], plan: null, log: [] };
  }

  /* ---------- Wachen ---------- */

  // Teilnehmende 3. LJ auf Wachen verteilen (eine Wache je Station). Klassen bleiben möglichst zusammen.
  function wachenKapazitaet(zustand) {
    const e = zustand.einstellungen, S = e.stationen.length, cap = Array(S).fill(0);
    zustand.fahrzeuge.forEach(f => { if (fzAktiv(f, e)) cap[f.wache - 1] += e.besatzung[f.typ][1]; });
    return cap.map(c => c || 1);
  }

  // Sollgröße je Wache: anteilig zu den Sitzplätzen der Wache (Methode des größten Rests)
  function sollGroessen(n, cap) {
    const summe = cap.reduce((a, b) => a + b, 0);
    const roh = cap.map(c => n * c / summe), soll = roh.map(Math.floor);
    let rest = n - soll.reduce((a, b) => a + b, 0);
    roh.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { soll[i]++; rest--; } });
    return soll;
  }

  // Teilnehmende 3. LJ auf Wachen verteilen (eine Wache je Station), anteilig zu den Sitzplätzen.
  // Klassen bleiben möglichst zusammen. nurOhneWache: nur Neue einsortieren, Bestehende bleiben.
  function wachenVerteilen(zustand, nurOhneWache) {
    const e = zustand.einstellungen, S = e.stationen.length;
    const tn = zustand.personen.filter(p => p.lj === 3 && aktiv(p, e));
    const cap = wachenKapazitaet(zustand);
    const soll = sollGroessen(tn.length, cap);
    const ok = p => p.wache >= 1 && p.wache <= S;
    if (!nurOhneWache) {
      tn.sort((a, b) => (a.klasse || '').localeCompare(b.klasse || '') || a.name.localeCompare(b.name));
      let w = 0, n = 0;
      tn.forEach(p => { while (w < S - 1 && n >= soll[w]) { w++; n = 0; } p.wache = w + 1; n++; });
      return;
    }
    const zaehl = Array(S).fill(0);
    tn.forEach(p => { if (ok(p)) zaehl[p.wache - 1]++; });
    tn.filter(p => !ok(p)).forEach(p => {
      let w = 0; for (let i = 1; i < S; i++) if (zaehl[i] - soll[i] < zaehl[w] - soll[w]) w = i;
      p.wache = w + 1; zaehl[w]++;
    });
  }

  // Wachen ausgleichen, wenn Fahrzeuge oder Leute am Tag wegfallen: verschiebt so wenige Personen wie nötig.
  function wachenAusgleichen(zustand) {
    const e = zustand.einstellungen, S = e.stationen.length;
    const tn = zustand.personen.filter(p => p.lj === 3 && aktiv(p, e) && p.wache >= 1 && p.wache <= S);
    const soll = sollGroessen(tn.length, wachenKapazitaet(zustand));
    const je = Array.from({ length: S }, (_, i) => tn.filter(p => p.wache === i + 1));
    let verschoben = 0;
    for (;;) {
      let hi = 0, lo = 0;
      for (let i = 1; i < S; i++) { if (je[i].length - soll[i] > je[hi].length - soll[hi]) hi = i; if (je[i].length - soll[i] < je[lo].length - soll[lo]) lo = i; }
      if (je[hi].length - soll[hi] <= 0 || je[lo].length - soll[lo] >= 0) break;
      const p = je[hi].pop(); p.wache = lo + 1; je[lo].push(p); verschoben++;
    }
    return verschoben;
  }

  // Fahrzeuge gleichmäßig nach Typ auf Wachen verteilen, Funkrufname vergeben.
  function fahrzeugWacheWaehlen(zustand, fz) {
    const S = zustand.einstellungen.stationen.length;
    const zaehl = Array(S).fill(0), gesamt = Array(S).fill(0);
    zustand.fahrzeuge.forEach(f => {
      if (f === fz || !f.wache || f.status === 'abgemeldet' || f.status === 'reserve') return;
      gesamt[f.wache - 1]++;
      if (f.typ === fz.typ) zaehl[f.wache - 1]++;
    });
    let w = 0;
    for (let i = 1; i < S; i++) if (zaehl[i] < zaehl[w] || (zaehl[i] === zaehl[w] && gesamt[i] < gesamt[w])) w = i;
    return w + 1;
  }

  function funkrufnameVergeben(zustand, fz) {
    const belegt = new Set(zustand.fahrzeuge.filter(f => f !== fz && f.wache === fz.wache && f.typ === fz.typ).map(f => f.nr));
    let n = 1; while (belegt.has(n)) n++;
    fz.nr = n;
    fz.funkrufname = (fz.wache || 'R') + '-' + fz.typ + '-' + n;
  }

  function fahrzeugHinzufuegen(zustand, daten) {
    const fz = {
      id: uid('f'), typ: daten.typ, kennzeichen: (daten.kennzeichen || '').trim().toUpperCase(),
      traeger: (daten.traeger || '').trim(), status: daten.status || 'da',
      registriert: daten.registriert || new Date().toISOString()
    };
    fz.wache = daten.status === 'reserve' ? 0 : (daten.wache || fahrzeugWacheWaehlen(zustand, fz));
    zustand.fahrzeuge.push(fz);
    funkrufnameVergeben(zustand, fz);
    return fz;
  }

  /* ---------- Planung ---------- */

  // Fahrzeug wird eingeplant? Reserve, defekt und abgemeldet nie; am SimTag (nurEingecheckte) nur angekommene.
  function fzAktiv(f, e) {
    if (f.status === 'abgemeldet' || f.status === 'defekt' || f.status === 'reserve' || !f.wache) return false;
    return e.nurEingecheckte ? f.status === 'da' : true;
  }

  function aktiv(p, e) {
    if (p.status === 'abgemeldet' || p.status === 'krank') return false;
    if (e.nurEingecheckte) return !!p.eingecheckt;
    return true;
  }

  function leereStatistik() { return { einsaetze: 0, erste: 0, nef: 0, fahrer: 0, pause: 0, fahrzeuge: {} }; }

  function statistikAus(plan, bisIndex) {
    const st = {};
    const g = id => (st[id] || (st[id] = leereStatistik()));
    (plan ? plan.durchgaenge : []).slice(0, bisIndex).forEach(d => {
      d.einsaetze.forEach(e => e.fahrzeuge.forEach(f => f.besatzung.forEach(pid => {
        const s = g(pid); s.einsaetze++;
        if (f.erste) s.erste++;
        if (f.typ === 'NEF') s.nef++;
        if (f.fahrer === pid) s.fahrer++;
        s.fahrzeuge[f.fid] = (s.fahrzeuge[f.fid] || 0) + 1;
      })));
      d.einsaetze.forEach(e => e.pause.forEach(pid => g(pid).pause++));
    });
    return st;
  }

  function rotiere(arr, k) { if (!arr.length) return arr; k = ((k % arr.length) + arr.length) % arr.length; return arr.slice(k).concat(arr.slice(0, k)); }

  function alarmMinute(e, pos) {
    const r = e.alarmRaster;
    if (pos < r.length) return r[pos];
    return r[r.length - 1] + 2 * (pos - r.length + 1);
  }

  // Plant einen Durchgang für eine Wache. Liefert {fahrzeuge:[...], pause:[...], hinweise:[...]}
  function planeWache(zustand, dIndex, wache, station, statistik, zufall) {
    const e = zustand.einstellungen;
    const leute = zustand.personen.filter(p => p.lj === 3 && p.wache === wache && aktiv(p, e));
    const fzAlle = zustand.fahrzeuge.filter(f => f.wache === wache && fzAktiv(f, e));
    const hinweise = [];
    const g = id => (statistik[id] || (statistik[id] = leereStatistik()));

    // Reihenfolge: RTW/KTW rotieren je Durchgang, damit jedes Fahrzeug mal vorne fährt; NEF an fester Position.
    const boden = fzAlle.filter(f => f.typ !== 'NEF').sort((a, b) => (a.typ === b.typ ? a.nr - b.nr : (a.typ === 'RTW' ? -1 : 1)));
    const nefs = fzAlle.filter(f => f.typ === 'NEF').sort((a, b) => a.nr - b.nr);
    const schritt = Math.max(1, Math.ceil(boden.length / Math.max(1, e.durchgaenge.length)));
    const reihe = rotiere(boden, dIndex * schritt);
    const nefsR = rotiere(nefs, dIndex);
    nefsR.forEach((n, i) => reihe.splice(Math.min(reihe.length, e.nefPosition - 1 + i * 4), 0, n));

    // Besatzungsstärke festlegen
    const min = f => e.besatzung[f.typ][0], max = f => e.besatzung[f.typ][1];
    let fahrzeuge = reihe.slice();
    let N = leute.length;
    while (fahrzeuge.length && fahrzeuge.reduce((s, f) => s + min(f), 0) > N) {
      // hinterstes Fahrzeug bleibt unbesetzt (NEF zuletzt streichen)
      let idx = fahrzeuge.length - 1;
      while (idx > 0 && fahrzeuge[idx].typ === 'NEF') idx--;
      hinweise.push(fahrzeuge[idx].funkrufname + ' bleibt unbesetzt (zu wenig Teilnehmende)');
      fahrzeuge.splice(idx, 1);
    }
    const groesse = fahrzeuge.map(min);
    let rest = N - groesse.reduce((s, x) => s + x, 0);
    // Zusätzliche Plätze zuerst auf RTW/KTW in Alarmreihenfolge, dann NEF
    for (const nurBoden of [true, false]) {
      for (let i = 0; i < fahrzeuge.length && rest > 0; i++) {
        if (nurBoden && fahrzeuge[i].typ === 'NEF') continue;
        if (groesse[i] < max(fahrzeuge[i])) { groesse[i]++; rest--; }
      }
    }
    const plaetze = groesse.reduce((s, x) => s + x, 0);

    // Wer pausiert? Die mit den meisten Einsätzen bisher (Zufall bei Gleichstand)
    const los = new Map(leute.map(p => [p.id, zufall()]));
    let kandidaten = leute.slice().sort((a, b) =>
      (g(a.id).einsaetze - g(b.id).einsaetze) || (Math.min(g(a.id).erste, 1) - Math.min(g(b.id).erste, 1)) || (g(b.id).pause - g(a.id).pause) || (los.get(a.id) - los.get(b.id)));
    const pause = kandidaten.slice(plaetze).map(p => p.id);
    kandidaten = kandidaten.slice(0, plaetze);

    // Plätze bilden und nach Seltenheit füllen: erste Welle, dann NEF, dann übrige
    const ergebnis = fahrzeuge.map((f, i) => ({
      fid: f.id, funkrufname: f.funkrufname, typ: f.typ, kennzeichen: f.kennzeichen, traeger: f.traeger,
      reihenfolge: i + 1, minute: alarmMinute(e, i), erste: i < e.ersteWelle, besatzung: [], fahrer: null
    }));
    const slots = [];
    ergebnis.forEach((f, i) => { for (let k = 0; k < groesse[i]; k++) slots.push(f); });
    const rang = f => (f.erste ? 0 : f.typ === 'NEF' ? 1 : 2);
    slots.sort((a, b) => rang(a) - rang(b) || a.reihenfolge - b.reihenfolge);

    const frei = new Set(kandidaten.map(p => p.id));
    const person = new Map(leute.map(p => [p.id, p]));
    for (const f of slots) {
      let best = null, bestK = Infinity;
      for (const pid of frei) {
        const s = g(pid);
        let k = 0;
        if (f.erste) k += 100 * s.erste;               // erste Welle: wer am seltensten vorne war
        if (f.typ === 'NEF') k += 100 * s.nef;          // NEF: wer am seltensten NEF hatte
        if (!f.erste && s.erste === 0) k += 40;       // Leute ohne erste Welle für spätere Durchgänge aufheben
        if (f.typ !== 'NEF' && s.nef === 0) k += 5;    // Leute ohne NEF bevorzugt für NEF aufheben
        k += 15 * (s.fahrzeuge[f.fid] || 0);           // nicht immer dasselbe Fahrzeug
        k += los.get(pid);
        if (k < bestK) { bestK = k; best = pid; }
      }
      if (best == null) break;
      frei.delete(best);
      f.besatzung.push(best);
    }

    // Fahrer: möglichst vom Träger des Fahrzeugs, sonst wer am seltensten gefahren ist
    ergebnis.forEach(f => {
      if (!f.besatzung.length) return;
      const eigene = f.besatzung.filter(pid => norm(person.get(pid).traeger) === norm(f.traeger));
      const pool = eigene.length ? eigene : f.besatzung;
      pool.sort((a, b) => g(a).fahrer - g(b).fahrer || los.get(a) - los.get(b));
      f.fahrer = pool[0];
      f.fahrerFremd = !eigene.length;
      // Fahrer an erste Stelle
      f.besatzung = [f.fahrer].concat(f.besatzung.filter(x => x !== f.fahrer));
    });

    // Statistik fortschreiben
    ergebnis.forEach(f => f.besatzung.forEach(pid => {
      const s = g(pid); s.einsaetze++; if (f.erste) s.erste++; if (f.typ === 'NEF') s.nef++;
      if (f.fahrer === pid) s.fahrer++; s.fahrzeuge[f.fid] = (s.fahrzeuge[f.fid] || 0) + 1;
    }));
    pause.forEach(pid => g(pid).pause++);

    return { wache, station, fahrzeuge: ergebnis.filter(f => f.besatzung.length), pause, hinweise };
  }

  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9äöüß]/g, ''); }

  function stationFuer(gruppe, dIndex, S) { return ((gruppe - 1 + dIndex) % S + S) % S; }

  // Gruppen (A, B, …) für 2. und 1. LJ
  function gruppenVerteilen(zustand, lj) {
    const S = zustand.einstellungen.stationen.length;
    const liste = zustand.personen.filter(p => p.lj === lj)
      .sort((a, b) => (a.klasse || '').localeCompare(b.klasse || '') || a.name.localeCompare(b.name));
    const ziel = Math.ceil(liste.length / S) || 1;
    liste.forEach((p, i) => { p.gruppe = Math.min(S, Math.floor(i / ziel) + 1); });
  }

  // Ganzer Plan oder ab Durchgang `abIndex` neu (frühere Durchgänge bleiben unverändert)
  function planen(zustand, abIndex) {
    const e = zustand.einstellungen;
    const S = e.stationen.length;
    abIndex = Math.max(0, abIndex || 0);
    if (!zustand.plan || abIndex === 0) abIndex = 0;
    if (zustand.personen.some(p => p.lj === 3 && !(p.wache >= 1 && p.wache <= S))) wachenVerteilen(zustand, true);
    if (abIndex > 0) wachenAusgleichen(zustand);
    [2, 1].forEach(lj => { if (zustand.personen.some(p => p.lj === lj && !(p.gruppe >= 1 && p.gruppe <= S))) gruppenVerteilen(zustand, lj); });

    const alt = zustand.plan;
    const statistik = statistikAus(alt, abIndex);
    const durchgaenge = [];
    e.durchgaenge.forEach((d, di) => {
      if (di < abIndex && alt && alt.durchgaenge[di]) { durchgaenge.push(alt.durchgaenge[di]); return; }
      const zufall = rng((e.seed || 1) * 31 + di * 7919 + (zustand.planZaehler || 0));
      const einsaetze = [];
      for (let w = 1; w <= S; w++) {
        const st = e.stationen[stationFuer(w, di, S)];
        einsaetze.push(planeWache(zustand, di, w, st.id, statistik, zufall));
      }
      const mimen = {}, zuschauer = {};
      for (let gr = 1; gr <= S; gr++) {
        mimen[e.stationen[stationFuer(gr, di, S)].id] = gr;
        zuschauer[e.stationen[stationFuer(gr + 2, di, S)].id] = gr;
      }
      durchgaenge.push({ id: d.id, einsaetze, mimen, zuschauer });
    });
    zustand.planZaehler = (zustand.planZaehler || 0) + 1;
    zustand.plan = { erstellt: new Date().toISOString(), abIndex, durchgaenge, fingerabdruck: fingerabdruck(zustand) };
    return zustand.plan;
  }

  // Erkennt, ob sich Fahrzeuge oder Teilnehmende seit der Planung geändert haben
  function fingerabdruck(zustand) {
    const e = zustand.einstellungen;
    const p = zustand.personen.filter(x => x.lj === 3 && aktiv(x, e)).map(x => x.id + ':' + x.wache).sort().join(',');
    const f = zustand.fahrzeuge.filter(x => fzAktiv(x, e)).map(x => x.id + ':' + x.wache).sort().join(',');
    return hash(p + '|' + f + '|' + JSON.stringify([e.besatzung, e.ersteWelle, e.nefPosition, e.stationen.length, e.durchgaenge.length]));
  }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function planVeraltet(zustand) { return !zustand.plan || zustand.plan.fingerabdruck !== fingerabdruck(zustand); }

  // Index des Durchgangs, der zur Uhrzeit (Minuten) läuft oder als nächstes kommt
  function aktuellerDurchgang(e, minute) {
    for (let i = 0; i < e.durchgaenge.length; i++) if (minute < zeitZuMin(e.durchgaenge[i].ende)) return i;
    return e.durchgaenge.length;
  }

  /* ---------- Auswertung ---------- */

  function gerechtigkeit(zustand) {
    const st = statistikAus(zustand.plan, zustand.plan ? zustand.plan.durchgaenge.length : 0);
    const tn = zustand.personen.filter(p => p.lj === 3 && aktiv(p, zustand.einstellungen));
    const werte = k => tn.map(p => (st[p.id] || leereStatistik())[k]);
    const verteilung = arr => { const m = {}; arr.forEach(v => { m[v] = (m[v] || 0) + 1; }); return m; };
    return {
      anzahl: tn.length,
      einsaetze: verteilung(werte('einsaetze')),
      erste: verteilung(werte('erste')),
      nef: verteilung(werte('nef')),
      ohneErste: tn.filter(p => !(st[p.id] && st[p.id].erste)).map(p => p.id),
      statistik: st
    };
  }

  function kapazitaet(zustand) {
    const e = zustand.einstellungen;
    const fz = zustand.fahrzeuge.filter(f => fzAktiv(f, e));
    const anz = t => fz.filter(f => f.typ === t).length;
    const min = TYPEN.reduce((s, t) => s + anz(t) * e.besatzung[t][0], 0);
    const max = TYPEN.reduce((s, t) => s + anz(t) * e.besatzung[t][1], 0);
    const tn = zustand.personen.filter(p => p.lj === 3 && aktiv(p, e)).length;
    const ersteSitze = e.stationen.length * e.durchgaenge.length * e.ersteWelle * e.besatzung.RTW[1];
    return { RTW: anz('RTW'), KTW: anz('KTW'), NEF: anz('NEF'), min, max, tn, ersteSitze };
  }

  // Persönlicher Plan einer Person
  function persoenlicherPlan(zustand, pid) {
    const e = zustand.einstellungen, p = zustand.personen.find(x => x.id === pid);
    if (!p) return null;
    const station = id => e.stationen.find(s => s.id === id);
    const name = id => { const q = zustand.personen.find(x => x.id === id); return q ? q.name : '?'; };
    const zeilen = [];
    (zustand.plan ? zustand.plan.durchgaenge : []).forEach((d, di) => {
      const dg = e.durchgaenge[di]; if (!dg) return;
      const start = zeitZuMin(dg.start);
      if (p.lj === 3) {
        let z = null;
        d.einsaetze.forEach(ei => {
          ei.fahrzeuge.forEach(f => {
            if (f.besatzung.includes(pid)) z = {
              art: 'einsatz', station: station(ei.station), wache: ei.wache, funkrufname: f.funkrufname, typ: f.typ,
              kennzeichen: f.kennzeichen, traeger: f.traeger, rolle: f.fahrer === pid ? 'Fahrer:in' : 'Besatzung',
              erste: f.erste, reihenfolge: f.reihenfolge, alarm: minZuZeit(start + f.minute),
              team: f.besatzung.filter(x => x !== pid).map(name)
            };
          });
          if (ei.pause.includes(pid)) z = { art: 'pause', station: station(ei.station), wache: ei.wache };
        });
        zeilen.push(Object.assign({ durchgang: di + 1, von: dg.start, bis: dg.ende }, z || { art: 'frei' }));
      } else {
        const tab = p.lj === 2 ? d.mimen : d.zuschauer;
        const sid = Object.keys(tab).find(k => tab[k] === p.gruppe);
        zeilen.push({
          durchgang: di + 1, von: dg.start, bis: dg.ende, art: p.lj === 2 ? 'mime' : 'zuschauen', station: station(sid),
          schminken: minZuZeit(start - e.schminkenVorher), treffen: minZuZeit(start - e.treffenVorher)
        });
      }
    });
    return { person: p, zeilen };
  }



  /* ---------- Fahrzeug-Ankunft am SimTag ---------- */

  const ORTE = { BI: 'Bielefeld', GT: 'Gütersloh', HF: 'Herford', LIP: 'Lippe', DT: 'Lippe', LE: 'Lippe', HX: 'Höxter', WAR: 'Höxter', SO: 'Soest', LP: 'Lippstadt',
    HAM: 'Hamm', MS: 'Münster', D: 'Düsseldorf', PB: 'Paderborn', MI: 'Minden', WAF: 'Warendorf', BE: 'Beckum', UN: 'Unna', DO: 'Dortmund', HSK: 'Hochsauerland', OE: 'Olpe', COE: 'Coesfeld', ST: 'Steinfurt', BOR: 'Borken', RE: 'Recklinghausen' };

  function kzNorm(k) { return String(k || '').toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g, ''); }

  // Typische Lesefehler korrigieren: hinten Ziffern, vorne Buchstaben
  function kzKorrigiert(k) {
    const n = kzNorm(k);
    const zuZiffer = { O: '0', D: '0', I: '1', L: '1', Z: '2', S: '5', B: '8', G: '6', T: '7' };
    const zuBuchst = { 0: 'O', 1: 'I', 2: 'Z', 5: 'S', 8: 'B', 6: 'G' };
    const m = n.match(/^(.*?)([0-9OIZSBGDLT]{1,4})([EH]?)$/);
    if (!m || !m[1]) return n;
    return m[1].replace(/[0-9]/g, c => zuBuchst[c] || c) + m[2].replace(/[A-Z]/g, c => zuZiffer[c] || c) + m[3];
  }

  function abstand(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }

  // Sucht ein Fahrzeug der Vorplanung zum (evtl. ungenau gelesenen) Kennzeichen
  function fahrzeugZuKennzeichen(zustand, kz) {
    const kandidaten = [kzNorm(kz), kzKorrigiert(kz)].filter(Boolean);
    if (!kandidaten[0]) return null;
    let best = null, bestD = Infinity, zweiter = Infinity;
    zustand.fahrzeuge.forEach(f => {
      const fk = kzNorm(f.kennzeichen); if (!fk) return;
      const dd = Math.min(...kandidaten.map(c => abstand(c, fk)));
      if (dd < bestD) { zweiter = bestD; bestD = dd; best = f; } else if (dd < zweiter) zweiter = dd;
    });
    const erlaubt = kandidaten[0].length >= 6 ? 2 : 1;
    if (!best || bestD > erlaubt || (bestD > 0 && zweiter <= bestD)) return null;

  }

        : '<button class="knopf haupt" data-act="selbst-checkin">Ich bin da</button>') + '</div>';
    if (m.status === 'krank') h += '<div class="hinweis rot">Du bist als krank gemeldet und nicht eingeplant. Melde dich am Eingang, falls du doch da bist.</div>';

          '<div class="zeile">' + typ(z.typ) + frnChip(z.funkrufname, z.wache) + kz(z.kennzeichen) + '<span class="leise">' + esc(z.traeger) + '</span></div>' +
          '<div class="alarm">Alarm ca. <b>' + esc(z.alarm) + '</b> <span class="leise">· Fahrzeug ' + z.reihenfolge + ' in der Alarmfolge</span></div>' +
          '<div><b>' + esc(z.rolle) + '</b>' + (z.team.length ? ' mit ' + z.team.map(esc).join(', ') : ' (allein)') + '</div>';
      } else if (z.art === 'pause') {
        kl += ' pause';
        innen = '<div class="zeile"><h3>Ohne Fahrzeug</h3>' + (lauf ? '<span class="pille gut">läuft</span>' : '') + '</div><div>Du begleitest deine Wache als Beobachter:in an der Station <b>' + esc(st.name) + '</b>. In den anderen Durchgängen fährst du dafür öfter.</div>';
      } else if (z.art === 'mime') {
        innen = '<div class="zeile"><h3>' + esc(st.name) + '</h3><span class="pille">Verletztendarstellung</span>' + (lauf ? '<span class="pille gut">läuft</span>' : '') + '</div>' +
          '<div class="zeile"><span>Schminken <b class="mono">' + esc(z.schminken) + '</b></span><span>Treffen am Einsatzort <b class="mono">' + esc(z.treffen) + '</b></span></div>';
      } else if (z.art === 'zuschauen') {
        innen = '<div class="zeile"><h3>' + esc(st.name) + '</h3><span class="pille">Beobachtung, Reserve</span>' + (lauf ? '<span class="pille gut">läuft</span>' : '') + '</div>' +
          '<div>Treffen an der Station <b class="mono">' + esc(z.treffen) + '</b>. Bleib erreichbar, falls du als Reserve gebraucht wirst.</div>';
      } else {

      }
      h += '<article class="' + kl + '"><div class="zeit">' + esc(z.von) + '<small>bis ' + esc(z.bis) + ' · D' + z.durchgang + '</small></div><div>' + innen + '</div></article>';
    });
    if (!m.zeilen.length) h += '<div class="hinweis">Der Plan ist noch nicht erstellt.</div>';

  /* ================= Check-in ================= */
  function viewCheckin() {
    const url = checkinUrl();
    let h = '<div class="seitenkopf"><div><div class="eyebrow">Am Eingang</div><h1>Check-in</h1></div><p>Bestätige mit deinem Code, dass du da bist. Erst dann wirst du am Tag fest eingeplant.</p></div>';
    h += '<form class="flaeche" id="checkin-form"><div class="zeile"><label class="feld" for="checkin-code"><span>Dein Code</span><input id="checkin-code" class="code-eingabe" type="text" maxlength="8" autocomplete="off" value="' + esc(ui.code) + '" placeholder="ABC123"></label>' +
      '<button class="knopf haupt gross" type="submit">Ich bin da</button></div><div id="checkin-ergebnis">' + (ui.checkinMeldung || '') + '</div></form>';
    if (Store.orga) h += '<section class="flaeche"><h3>QR-Code für den Eingang</h3><p class="leise">Ausdrucken und am Eingang aufhängen. Er führt direkt auf diese Seite.</p><div class="qr" id="qr-eingang"></div><p class="mono leise">' + esc(url) + '</p></section>';
    return h;
  }
  function checkinUrl() {
    const basis = location.href.split('#')[0].split('?')[0];
    return basis + '#checkin';
  }

  /* ================= Lagekarte ================= */
  const KW = 1000, KH = 625;
  function fahrzeugLage(e, plan, t) {
    // liefert pro Fahrzeug-ID {x,y,zustand,station}
    const di = C.aktuellerDurchgang(e, t);
    const br = e.bereitstellung, lage = {};
    const d = plan && plan.durchgaenge[di], dg = e.durchgaenge[di];
    if (!d || !dg) return { di, lage };
    const start = C.zeitZuMin(dg.start), ende = C.zeitZuMin(dg.ende);
    d.einsaetze.forEach(ei => {
      const st = station(e, ei.station);
      ei.fahrzeuge.forEach((f, i) => {
        const alarm = start + f.minute, an = alarm + (e.anfahrtMin || 2);
        const ring = (k, n, r) => { const w = (k / Math.max(1, n)) * Math.PI * 2; return [Math.cos(w) * r, Math.sin(w) * r]; };
        const [ox, oy] = ring(i, ei.fahrzeuge.length, 34 + (i % 2) * 10);
        const sx = st.x * KW + ox, sy = st.y * KH + oy;
        const bx = br.x * KW + ((ei.wache - 3) * 26), by = br.y * KH + (i - ei.fahrzeuge.length / 2) * 6;
        let x = bx, y = by, z = 'bereit';
        if (t >= ende || t < start - 30) { z = t >= ende ? 'zurueck' : 'bereit'; }
        else if (t >= an) { x = sx; y = sy; z = 'vorort'; }
        else if (t >= alarm) { const p = (t - alarm) / Math.max(0.1, an - alarm); x = bx + (sx - bx) * p; y = by + (sy - by) * p; z = 'anfahrt'; }
        lage[f.fid] = { x, y, z, station: st.id, f, alarm };
      });
    });
    return { di, lage };
  }

  function karteSvg(e, plan, t, bearbeitbar) {
    const { lage } = fahrzeugLage(e, plan, t);
    let s = '<svg viewBox="0 0 ' + KW + ' ' + KH + '" role="img" aria-label="Lagekarte des Übungsgeländes">';
    if (e.karteBild) s += '<image href="' + esc(e.karteBild) + '" x="0" y="0" width="' + KW + '" height="' + KH + '" preserveAspectRatio="xMidYMid slice"/>';
    else {
      // schematisches Gelände, bis ein echter Lageplan hochgeladen ist
      s += '<rect width="' + KW + '" height="' + KH + '" fill="var(--map-ground)"/>' +
        '<path d="M0 312 H1000 M500 0 V625 M140 0 C 180 200, 120 420, 200 625" stroke="var(--map-road)" stroke-width="26" fill="none"/>' +
        '<path d="M0 312 H1000 M500 0 V625 M140 0 C 180 200, 120 420, 200 625" stroke="var(--line)" stroke-width="1" stroke-dasharray="10 12" fill="none"/>' +
        [[600, 380, 140, 70], [780, 120, 120, 80], [330, 90, 110, 60], [360, 420, 90, 80], [860, 470, 100, 90]].map(r => '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" fill="var(--map-build)" rx="3"/>').join('') +
        '<text x="16" y="606" class="klein-label">Schema – Lageplan des Geländes in den Einstellungen hochladen</text>';
    }
    const ein = e.eingang, br = e.bereitstellung;
    s += '<g class="' + (bearbeitbar ? 'zieh' : '') + '" data-ziehen="eingang"><rect x="' + (ein.x * KW - 40) + '" y="' + (ein.y * KH - 16) + '" width="80" height="32" rx="4" fill="var(--fg)"/><text x="' + ein.x * KW + '" y="' + (ein.y * KH + 5) + '" text-anchor="middle" class="st-label" style="fill:var(--bg);stroke:none;font-size:13px">EINGANG</text></g>';
    s += '<g class="' + (bearbeitbar ? 'zieh' : '') + '" data-ziehen="bereitstellung"><rect x="' + (br.x * KW - 90) + '" y="' + (br.y * KH - 40) + '" width="180" height="80" rx="6" fill="none" stroke="var(--blau)" stroke-width="2" stroke-dasharray="6 5"/><text x="' + br.x * KW + '" y="' + (br.y * KH - 46) + '" text-anchor="middle" class="st-label" style="font-size:13px">Bereitstellungsraum</text></g>';
    e.stationen.forEach((st, i) => {
      const x = st.x * KW, y = st.y * KH;
      s += '<g class="' + (bearbeitbar ? 'zieh' : '') + '" data-ziehen="st:' + i + '"><circle cx="' + x + '" cy="' + y + '" r="58" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2"/>' +
        '<text x="' + x + '" y="' + (y - 64) + '" text-anchor="middle" class="st-label">' + esc(st.id.replace('S', 'SIM ') + ' · ' + st.name) + '</text>' +
        '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" class="klein-label">' + (st.patienten || 0) + ' Pat.</text></g>';
    });
    const farbe = { RTW: 'var(--accent)', KTW: 'var(--blau)', NEF: 'var(--sk1)' };
    Object.values(lage).forEach(l => {
      if (l.z === 'zurueck') return;
      s += '<g><title>' + esc(l.f.funkrufname + ' · ' + (l.z === 'vorort' ? 'vor Ort' : l.z === 'anfahrt' ? 'auf Anfahrt' : 'Alarm ' + C.minZuZeit(l.alarm))) + '</title>' +
        '<rect x="' + (l.x - 7) + '" y="' + (l.y - 4.5) + '" width="14" height="9" rx="2" fill="' + farbe[l.f.typ] + '" stroke="var(--surface)" stroke-width="1.2" opacity="' + (l.z === 'bereit' ? 0.55 : 1) + '"/></g>';
    });
    return s + '</svg>';
  }

  function viewLage() {
    const e = pub.einstellungen, t = jetztMin();
    const { di, lage } = fahrzeugLage(e, pub.plan, t);
    const dg = e.durchgaenge[di];
    let h = '<div class="seitenkopf"><div><div class="eyebrow">Live</div><h1>Lagekarte</h1></div><p>' +
      (dg ? 'Durchgang ' + (di + 1) + ' · ' + dg.start + '–' + dg.ende + (t < C.zeitZuMin(dg.start) ? ' (beginnt gleich)' : ' (läuft)') : 'Alle Durchgänge sind beendet.') + ' · Stand ' + C.minZuZeit(t) + ' Uhr</p></div>';
    h += '<div class="lage"><div class="flaeche"><div class="karte" id="karte">' + karteSvg(e, pub.plan, t, Store.orga) + '</div>' +
      '<div class="legende"><span><i style="background:var(--accent)"></i>RTW</span><span><i style="background:var(--blau)"></i>KTW</span><span><i style="background:var(--sk1)"></i>NEF</span><span>blass = wartet im Bereitstellungsraum</span>' +
      (Store.orga ? '<span>Stationen, Eingang und Bereitstellungsraum lassen sich mit der Maus verschieben.</span>' : '') + '</div></div>';
    h += '<aside class="flaeche"><h3>Stationen jetzt</h3>';
    const d = pub.plan && pub.plan.durchgaenge[di];
    e.stationen.forEach(st => {
      const ei = d && d.einsaetze.find(x => x.station === st.id);
      const fz = Object.values(lage).filter(l => l.station === st.id);
      const vor = fz.filter(l => l.z === 'vorort').length, an = fz.filter(l => l.z === 'anfahrt').length;
      const naechster = fz.filter(l => l.z === 'bereit').sort((a, b) => a.alarm - b.alarm)[0];
      h += '<div style="display:grid;gap:3px"><div class="zeile"><b>' + esc(st.name) + '</b>' + (ei ? '<span class="pille">Wache ' + ei.wache + '</span>' : '') + '</div>' +
        '<div class="leise">' + vor + ' vor Ort · ' + an + ' auf Anfahrt · ' + (fz.length - vor - an) + ' warten' + (naechster ? ' · nächster Alarm ' + C.minZuZeit(naechster.alarm) + ' <span class="frn">' + esc(naechster.f.funkrufname) + '</span>' : '') + '</div>' +
        '<div class="balken" aria-hidden="true"><i style="width:' + (fz.length ? vor / fz.length * 100 : 0) + '%;background:var(--sk3)"></i><i style="width:' + (fz.length ? an / fz.length * 100 : 0) + '%;background:var(--sk2)"></i></div></div>';
    });
    const zl = pub.zaehlung;
    h += '<div class="trenner"></div><h3>Auf dem Gelände</h3><div class="leise">3. LJ ' + zl[3].da + '/' + zl[3].gesamt + ' · 2. LJ ' + zl[2].da + '/' + zl[2].gesamt + ' · 1. LJ ' + zl[1].da + '/' + zl[1].gesamt + ' eingecheckt</div></aside></div>';
    return h;
  }

  /* ================= Stationen ================= */
  function viewStationen() {
    const e = pub.einstellungen, plan = Store.orga && voll ? voll.plan : pub.plan;
    const st = station(e, ui.station);
    let h = '<div class="seitenkopf"><div><div class="eyebrow">Für Stationsleitungen</div><h1>Alarmierung ' + esc(st.id.replace('S', 'SIM ')) + '</h1></div><p>Welche Wache kommt wann, und in welcher Minute wird welches Fahrzeug alarmiert.</p></div>';
    h += '<div class="zeile">' + e.stationen.map(s => '<button class="knopf" data-act="station" data-id="' + s.id + '" aria-pressed="' + (s.id === st.id) + '">' + esc(s.id.replace('S', 'SIM ') + ' ' + s.name) + '</button>').join('') + '</div>';
    if (!plan) return h + '<div class="hinweis">Noch kein Plan erstellt.</div>';
    const name = id => { const p = voll && voll.personen.find(x => x.id === id); return p ? p.name : ''; };
    plan.durchgaenge.forEach((d, di) => {
      const dg = e.durchgaenge[di]; if (!dg) return;
      const ei = d.einsaetze.find(x => x.station === st.id); if (!ei) return;
      const start = C.zeitZuMin(dg.start);
      const mg = d.mimen[st.id], zg = d.zuschauer[st.id];
      const anzM = pub.gruppen[2] ? pub.gruppen[2][mg] || 0 : 0, anzZ = pub.gruppen[1] ? pub.gruppen[1][zg] || 0 : 0;
      h += '<section class="flaeche"><div class="zeile" style="justify-content:space-between"><h2>Durchgang ' + (di + 1) + ' · ' + dg.start + '–' + dg.ende + '</h2><div class="zeile"><span class="pille akzent">Wache ' + ei.wache + '</span>' +
        '<span class="pille">Mimen Gruppe ' + gruppeBuchst(mg) + ' (' + anzM + ')</span><span class="pille">Beobachtung Gruppe ' + gruppeBuchst(zg) + ' (' + anzZ + ')</span></div></div>' +
        '<div class="leise">Mimen schminken ab ' + C.minZuZeit(start - e.schminkenVorher) + ', Treffen am Einsatzort ' + C.minZuZeit(start - e.treffenVorher) + '.</div>';
      h += '<div class="tabelle-box"><table><thead><tr><th>Alarm</th><th>Minute</th><th>Fahrzeug</th><th>Typ</th><th>Kennzeichen</th><th>Träger</th><th>Besatzung</th></tr></thead><tbody>';
      ei.fahrzeuge.forEach(f => {
        const bes = Array.isArray(f.besatzung) ? (Store.orga ? f.besatzung.map(name).join(', ') : f.besatzung.length + ' Pers.') : f.besatzung + ' Pers.';
        h += '<tr class="' + (f.erste ? 'erste' : '') + '"><td class="mono">' + C.minZuZeit(start + f.minute) + '</td><td class="mono">+' + f.minute + '</td><td>' + frnChip(f.funkrufname, ei.wache) + '</td><td>' + typ(f.typ) + '</td><td>' + kz(f.kennzeichen) + '</td><td>' + esc(f.traeger) + '</td><td>' + esc(bes) + '</td></tr>';
      });
      h += '</tbody></table></div>' + (ei.hinweise && ei.hinweise.length ? '<div class="hinweis">' + ei.hinweise.map(esc).join('<br>') + '</div>' : '') + '</section>';
    });
    return h;
  }

  /* ================= Orga ================= */
  function viewOrga() {
    if (!Store.orga) {
      return '<div class="seitenkopf"><div><div class="eyebrow">Nur für das Orga-Team</div><h1>Orga-Bereich</h1></div><p>Hier werden Teilnehmende und Fahrzeuge verwaltet und der Plan erstellt.</p></div>' +
        '<form class="flaeche" id="login-form" style="max-width:420px"><label class="feld" for="pw"><span>Passwort</span><input id="pw" type="password" autocomplete="current-password"></label>' +
        '<button class="knopf haupt" type="submit">Anmelden</button>' + (Store.modus === 'demo' ? '<p class="leise">Demo-Passwort: <span class="mono">' + DEMO_PASSWORT + '</span></p>' : '') + '<div id="login-fehler"></div></form>';
    }
    if (!voll) return '<p class="leise">Lade Daten …</p>';
    const tabs = [['lage', 'Lage'], ['fahrzeuge', 'Fahrzeuge'], ['personen', 'Teilnehmende'], ['plan', 'Plan'], ['gerecht', 'Gerechtigkeit'], ['einst', 'Einstellungen']];
    let h = '<div class="seitenkopf"><div><div class="eyebrow">Orga-Team</div><h1>Steuerung</h1></div><button class="knopf klein" data-act="abmelden">Abmelden</button></div>';
    h += '<div class="tabs" role="tablist">' + tabs.map(([id, t]) => '<button role="tab" data-act="tab" data-id="' + id + '" aria-selected="' + (ui.orgaTab === id) + '">' + t + '</button>').join('') + '</div>';
    h += ({ lage: orgaLage, fahrzeuge: orgaFahrzeuge, personen: orgaPersonen, plan: orgaPlan, gerecht: orgaGerecht, einst: orgaEinst })[ui.orgaTab]();
    return h;
  }

  function naechsterOffenerDurchgang(e) {
    const t = jetztMin();
    for (let i = 0; i < e.durchgaenge.length; i++) if (t < C.zeitZuMin(e.durchgaenge[i].start)) return i;
    return e.durchgaenge.length;
  }

  function planStatus() {
    const z = voll, e = z.einstellungen;
    const veraltet = C.planVeraltet(z);
    const ab = naechsterOffenerDurchgang(e);
    let h = '';
    if (!z.plan) h += '<div class="hinweis rot"><b>Noch kein Plan.</b> <button class="knopf haupt klein" data-act="planen" data-ab="0">Plan erstellen</button></div>';
    else if (veraltet) {
      h += '<div class="hinweis rot"><b>Der Plan passt nicht mehr</b> zu den aktuellen Fahrzeugen oder Teilnehmenden. ' +
        (ab < e.durchgaenge.length ? '<button class="knopf haupt klein" data-act="planen" data-ab="' + ab + '">Ab Durchgang ' + (ab + 1) + ' neu planen</button> ' : 'Alle Durchgänge haben schon begonnen. ') +
        '<button class="knopf klein" data-act="planen" data-ab="0">Alles neu planen</button></div>';
    } else h += '<div class="hinweis gruen">Der Plan ist aktuell (erstellt ' + new Date(z.plan.erstellt).toLocaleString('de-DE', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) + ').</div>';
    return h;
  }

  function orgaLage() {
    const z = voll, e = z.einstellungen, k = C.kapazitaet(z);
    const lj = n => z.personen.filter(p => p.lj === n && p.status !== 'abgemeldet');
    const kart = (zahl, text) => '<div class="kennzahl"><b>' + zahl + '</b><span>' + text + '</span></div>';
    let h = planStatus();
    h += '<div class="raster">';
    h += '<section class="flaeche"><h3>Teilnehmende</h3><div class="raster" style="grid-template-columns:repeat(3,1fr)">' +
      [3, 2, 1].map(n => kart(lj(n).filter(p => p.eingecheckt).length + '<span class="leise" style="font-size:1rem"> / ' + lj(n).length + '</span>', n + '. LJ eingecheckt')).join('') + '</div>' +
      '<label class="zeile" for="nur-ein"><input id="nur-ein" type="checkbox" data-act="nur-eingecheckte"' + (e.nurEingecheckte ? ' checked' : '') + '> <b>SimTag läuft:</b> nur eingecheckte Teilnehmende und angekommene Fahrzeuge einplanen</label></section>';
    h += '<section class="flaeche"><h3>Fahrzeuge</h3><div class="raster" style="grid-template-columns:repeat(3,1fr)">' + kart(k.RTW, 'RTW') + kart(k.KTW, 'KTW') + kart(k.NEF, 'NEF') + '</div>' +
      '<p class="leise">' + z.fahrzeuge.filter(f => f.status === 'da').length + ' vor Ort angemeldet, ' + z.fahrzeuge.filter(f => f.status === 'gemeldet').length + ' nur vorab gemeldet, ' + z.fahrzeuge.filter(f => f.status === 'defekt' || f.status === 'abgemeldet').length + ' fallen aus.</p></section>';
    const proD = Math.min(k.tn, k.max);
    h += '<section class="flaeche"><h3>Rechnung je Durchgang</h3><p>' + k.tn + ' Teilnehmende im 3. LJ, ' + k.min + ' bis ' + k.max + ' Sitzplätze. ' +
      (k.tn > k.max ? 'Pro Durchgang fahren ' + proD + ', ' + (k.tn - k.max) + ' beobachten.' : k.tn < k.min ? '<b>Zu wenige Leute:</b> einige Fahrzeuge bleiben unbesetzt.' : 'Alle fahren in jedem Durchgang.') + '</p>' +
      '<p class="leise">Erste Welle: ' + k.ersteSitze + ' Plätze über den Tag. ' + (k.ersteSitze >= k.tn ? 'Das reicht, damit jede Person mindestens einmal vorne fährt.' : 'Das reicht nicht für alle. Erste Welle in den Einstellungen vergrößern.') + '</p></section>';
    h += '</div>';
    h += '<section class="flaeche"><h3>Check-in am Eingang</h3><div class="zeile" style="align-items:start;gap:20px"><div class="qr" id="qr-eingang"></div><div style="display:grid;gap:8px;min-width:0"><p>Diesen QR-Code am Eingang aufhängen. Teilnehmende scannen ihn und geben ihren Code ein.</p><p class="mono leise" style="word-break:break-all">' + esc(checkinUrl()) + '</p>' +
      '<label class="feld" for="orga-checkin"><span>Für jemanden einchecken (Code)</span><input id="orga-checkin" type="text" class="mono" maxlength="8" placeholder="ABC123"></label><button class="knopf" data-act="orga-checkin">Einchecken</button></div></div></section>';
    return h;
  }

  function orgaPersonen() {
    const z = voll, q = ui.suche.toLowerCase();
    const liste = z.personen.filter(p => p.lj === ui.filterLj && (!q || (p.name + ' ' + p.klasse + ' ' + p.traeger + ' ' + p.code).toLowerCase().includes(q)))
      .sort((a, b) => (a.klasse || '').localeCompare(b.klasse || '') || a.name.localeCompare(b.name));
    let h = planStatus();
    h += '<section class="flaeche"><div class="zeile">' + [3, 2, 1].map(n => '<button class="knopf" data-act="lj" data-lj="' + n + '" aria-pressed="' + (ui.filterLj === n) + '">' + n + '. LJ (' + z.personen.filter(p => p.lj === n).length + ')</button>').join('') +
      '<label class="feld" for="suche" style="flex:1;min-width:180px"><span>Suchen</span><input id="suche" type="text" value="' + esc(ui.suche) + '" placeholder="Name, Klasse, Träger oder Code"></label></div>' +
      '<div class="tabelle-box"><table><thead><tr><th>Name</th><th>Klasse</th><th>Träger</th><th>' + (ui.filterLj === 3 ? 'Wache' : 'Gruppe') + '</th><th>Code</th><th>Status</th><th>Check-in</th></tr></thead><tbody>' +
      liste.map(p => '<tr class="' + (p.status === 'krank' || p.status === 'abgemeldet' ? 'aus' : '') + '"><td>' + esc(p.name) + '</td><td>' + esc(p.klasse) + '</td><td>' + esc(p.traeger) + '</td><td>' + (p.lj === 3 ? p.wache || '–' : gruppeBuchst(p.gruppe)) + '</td><td class="mono">' + esc(p.code) + '</td><td>' +
        '<select data-act="p-status" data-id="' + p.id + '" aria-label="Status ' + esc(p.name) + '">' + [['angemeldet', 'angemeldet'], ['krank', 'krank'], ['abgemeldet', 'abgemeldet']].map(([v, t]) => '<option value="' + v + '"' + (p.status === v ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></td><td>' +
        (p.eingecheckt ? '<button class="knopf klein" data-act="p-checkout" data-id="' + p.id + '">✓ ' + new Date(p.eingecheckt).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '</button>' : '<button class="knopf klein" data-act="p-checkin" data-id="' + p.id + '">einchecken</button>') + '</td></tr>').join('') +
      '</tbody></table></div></section>';
    h += '<section class="flaeche"><h3>Teilnehmende einfügen</h3><p class="leise">Aus Excel kopieren und hier einfügen, eine Person pro Zeile: <span class="mono">Name; Klasse; Ausbildungsjahr; Träger</span>. Codes werden automatisch vergeben.</p>' +
      '<textarea id="import" placeholder="Muster, Lena;24A;3;Kreis Gütersloh"></textarea><div class="zeile"><button class="knopf haupt" data-act="import">Einfügen</button>' +
      (window.SIMTAG_DEMO ? '' : '<button class="knopf" data-act="codes-csv">Codeliste herunterladen (CSV)</button>') + '<button class="knopf" data-act="wachen-neu">Wachen und Gruppen neu verteilen</button></div>' +
      '<p class="leise">„Neu verteilen“ nur vor dem SimTag benutzen. Am Tag selbst gleicht „Neu planen“ die Wachen automatisch aus und verschiebt nur so wenige Leute wie nötig.</p></section>';
    return h;
  }

  function orgaPlan() {
    const z = voll, e = z.einstellungen;
    let h = planStatus();
    if (!z.plan) return h;
    const di = Math.min(ui.planD, z.plan.durchgaenge.length - 1), d = z.plan.durchgaenge[di], dg = e.durchgaenge[di];
    const name = id => { const p = z.personen.find(x => x.id === id); return p ? p.name : '?'; };
    h += '<div class="zeile">' + e.durchgaenge.map((x, i) => '<button class="knopf" data-act="plan-d" data-i="' + i + '" aria-pressed="' + (i === di) + '">D' + (i + 1) + ' · ' + x.start + '</button>').join('') + '</div>';
    d.einsaetze.forEach(ei => {
      const st = station(e, ei.station), start = C.zeitZuMin(dg.start);
      h += '<section class="flaeche"><div class="zeile" style="justify-content:space-between"><h3>Wache ' + ei.wache + ' → ' + esc(st.id.replace('S', 'SIM ') + ' ' + st.name) + '</h3><span class="leise">' + ei.fahrzeuge.reduce((s, f) => s + f.besatzung.length, 0) + ' fahren · ' + ei.pause.length + ' beobachten</span></div>' +
        '<div class="tabelle-box"><table><thead><tr><th>Alarm</th><th>Fahrzeug</th><th>Kennzeichen</th><th>Fahrer:in</th><th>Besatzung</th></tr></thead><tbody>' +
        ei.fahrzeuge.map(f => '<tr class="' + (f.erste ? 'erste' : '') + '"><td class="mono">' + C.minZuZeit(start + f.minute) + '</td><td>' + frnChip(f.funkrufname, ei.wache) + '</td><td>' + kz(f.kennzeichen) + '</td><td>' + esc(name(f.fahrer)) + (f.fahrerFremd ? ' <span class="pille warn" title="Niemand aus der Besatzung kommt vom Träger des Fahrzeugs">fremder Träger</span>' : '') + '</td><td>' + f.besatzung.filter(x => x !== f.fahrer).map(name).map(esc).join(', ') + '</td></tr>').join('') +
        '</tbody></table></div>' + (ei.pause.length ? '<p class="leise"><b>Beobachten:</b> ' + ei.pause.map(name).map(esc).join(', ') + '</p>' : '') +
        (ei.hinweise.length ? '<div class="hinweis">' + ei.hinweise.map(esc).join('<br>') + '</div>' : '') + '</section>';
    });
    return h;
  }

  function verteilungsBalken(titel, vert, gesamt, gutAb) {
    const keys = Object.keys(vert).map(Number).sort((a, b) => a - b);
    return '<section class="flaeche"><h3>' + titel + '</h3>' + keys.map(k => {
      const n = vert[k], pct = gesamt ? n / gesamt * 100 : 0;
      const farbe = k >= gutAb ? 'var(--sk3)' : 'var(--sk1)';
      return '<div style="display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center"><span class="mono">' + k + '×</span><div class="balken"><i style="width:' + pct + '%;background:' + farbe + '"></i></div><span class="mono">' + n + '</span></div>';
    }).join('') + '</section>';
  }

  function orgaGerecht() {
    const z = voll;
    if (!z.plan) return planStatus();
    const g = C.gerechtigkeit(z);
    const minE = Math.min(...Object.keys(g.einsaetze).map(Number)), maxE = Math.max(...Object.keys(g.einsaetze).map(Number));
    let h = planStatus();
    h += '<p>' + g.anzahl + ' Teilnehmende im 3. LJ. Jede Person fährt ' + (minE === maxE ? minE : minE + ' bis ' + maxE) + '-mal. ' + (g.ohneErste.length ? g.ohneErste.length + ' Person(en) sind nie in der ersten Welle.' : 'Alle sind mindestens einmal in der ersten Welle.') + '</p>';
    h += '<div class="raster">' + verteilungsBalken('Einsätze pro Person', g.einsaetze, g.anzahl, maxE - 1) + verteilungsBalken('Erste Welle pro Person', g.erste, g.anzahl, 1) + verteilungsBalken('NEF pro Person', g.nef, g.anzahl, 1) + '</div>';
    if (g.ohneErste.length) h += '<div class="hinweis">Nie in der ersten Welle: ' + g.ohneErste.map(id => esc((z.personen.find(p => p.id === id) || {}).name)).join(', ') + '</div>';
    h += '<p class="leise">So verteilt die App: Wer bisher am wenigsten gefahren ist, fährt zuerst. Die Plätze der ersten Welle bekommen die, die am seltensten vorne waren. Die NEF-Plätze bekommen die, die noch nie NEF hatten. Fahrer:in wird möglichst jemand vom Träger des Fahrzeugs. Niemand sitzt zweimal auf demselben Fahrzeug, wenn es sich vermeiden lässt.</p>';
    return h;
  }

  function orgaEinst() {
    const e = voll.einstellungen;
    let h = '<form class="flaeche" id="einst-form"><h3>Allgemein</h3><div class="raster">' +
      '<label class="feld" for="e-datum"><span>Datum</span><input id="e-datum" type="date" value="' + esc(e.datum) + '"></label>' +

      '<label class="feld" for="e-nef"><span>NEF wird als n-tes Fahrzeug alarmiert</span><input id="e-nef" type="number" min="1" max="10" value="' + e.nefPosition + '"></label>' +
      '<label class="feld" for="e-anfahrt"><span>Anfahrt (Minuten)</span><input id="e-anfahrt" type="number" min="0" max="15" value="' + e.anfahrtMin + '"></label>' +
      '<label class="feld" for="e-raster"><span>Alarmminuten in Reihenfolge</span><input id="e-raster" type="text" class="mono" value="' + esc(e.alarmRaster.join(', ')) + '"></label>' +
      '<label class="feld" for="e-schminken"><span>Schminken vor Start (Min.)</span><input id="e-schminken" type="number" min="0" value="' + e.schminkenVorher + '"></label>' +

    h += '<h3>Durchgänge</h3><div class="raster">' + e.durchgaenge.map((d, i) => '<div class="zeile"><b style="width:30px">D' + (i + 1) + '</b><input aria-label="D' + (i + 1) + ' Beginn" id="d-' + i + '-s" type="time" value="' + d.start + '" style="width:120px"><input aria-label="D' + (i + 1) + ' Ende" id="d-' + i + '-e" type="time" value="' + d.ende + '" style="width:120px"></div>').join('') + '</div>';
    h += '<h3>Stationen</h3><div class="raster">' + e.stationen.map((s, i) => '<div class="zeile"><b style="width:50px">' + s.id.replace('S', 'SIM ') + '</b><input aria-label="Name" id="s-' + i + '-n" type="text" value="' + esc(s.name) + '" style="flex:1;min-width:120px"><input aria-label="Patienten" id="s-' + i + '-p" type="number" min="0" value="' + (s.patienten || 0) + '" style="width:80px" title="Anzahl Patient:innen"></div>').join('') + '</div>';
    h += '<div class="zeile"><button class="knopf haupt" type="submit">Einstellungen speichern</button><span class="leise">Danach den Plan neu erstellen.</span></div></form>';
    h += '<section class="flaeche"><h3>Lageplan des Geländes</h3><p class="leise">Ein Bild vom LAFP-Gelände (Screenshot aus einer Karte oder ein Lageplan) als Hintergrund der Lagekarte. Danach Stationen auf der Lagekarte an die richtige Stelle ziehen.</p>' +

    h += '<section class="flaeche"><h3>Daten</h3><div class="zeile">' + (window.SIMTAG_DEMO ? '' : '<button class="knopf" data-act="export">Alles als Datei sichern (JSON)</button>') +
      (Store.modus === 'demo' ? '<button class="knopf" data-act="demo-reset">Demo-Daten neu erzeugen</button>' : '') + '</div></section>';

  }

  /* ================= Fahrzeuge: Vorplanung und Übersicht ================= */
  const FZ_STATUS = [['gemeldet', 'erwartet'], ['da', 'ist da'], ['reserve', 'Reserve'], ['defekt', 'defekt'], ['abgemeldet', 'abgemeldet']];
  const FZ_FILTER = [['alle', 'Alle'], ['gemeldet', 'Erwartet'], ['da', 'Ist da'], ['reserve', 'Reserve'], ['aus', 'Fällt aus']];
  const zeitKurz = iso => iso ? new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '';

  function traegerUebersicht(z) {
    const m = new Map();
    z.fahrzeuge.forEach(f => {
      const k = f.traeger || 'ohne Träger';
      if (!m.has(k)) m.set(k, { traeger: k, RTW: [0, 0], KTW: [0, 0], NEF: [0, 0], offen: [], extra: 0 });
      const t = m.get(k);
      if (f.status === 'reserve' || f.zusaetzlich) { t.extra++; if (f.status === 'reserve') return; }
      if (f.status === 'defekt' || f.status === 'abgemeldet') return;
      if (!f.zusaetzlich) t[f.typ][0]++;
      if (f.status === 'da') t[f.typ][1]++;
      if (f.status === 'gemeldet') t.offen.push(f);
    });
    return [...m.values()].sort((a, b) => a.traeger.localeCompare(b.traeger));
  }

  function orgaFahrzeuge() {
    const z = voll;
    const traeger = [...new Set(z.fahrzeuge.map(f => f.traeger).concat(z.personen.map(p => p.traeger)).filter(Boolean))].sort();
    let h = planStatus();
    h += '<div class="hinweis">Am SimTag werden Fahrzeuge über <a href="#ankunft">Ankunft</a> erfasst: Kennzeichen scannen, das Fahrzeug ist sofort als „ist da“ markiert und bekommt seine Kennung.</div>';

    // Vorplanung je Träger
    const tu = traegerUebersicht(z);
    h += '<section class="flaeche"><h3>Vorplanung je Träger</h3><p class="leise">So viele Fahrzeuge hat jeder Träger zugesagt. Jedes bekommt schon jetzt eine Kennung. Kennzeichen sind freiwillig; wenn sie bekannt sind, erkennt die Ankunft das Fahrzeug direkt.</p>' +
      '<div class="tabelle-box"><table><thead><tr><th>Träger</th><th>RTW</th><th>KTW</th><th>NEF</th><th>Zusätzlich</th><th>Noch erwartet</th></tr></thead><tbody>' +
      tu.map(t => '<tr><td>' + esc(t.traeger) + '</td>' + C.TYPEN.map(ty => '<td class="mono">' + t[ty][1] + '/' + t[ty][0] + '</td>').join('') + '<td class="mono">' + (t.extra || '') + '</td><td>' + t.offen.map(f => frnChip(f.funkrufname, f.wache)).join(' ') + '</td></tr>').join('') +
      '</tbody></table></div><p class="leise">Zahlen: angekommen / zugesagt.</p>' +
      '<form id="vp-form" class="zeile" style="align-items:end"><label class="feld" for="vp-tr" style="flex:1;min-width:180px"><span>Träger</span><input id="vp-tr" type="text" list="traeger-liste" autocomplete="off"></label>' +
      C.TYPEN.map(t => '<label class="feld" for="vp-' + t + '" style="width:80px"><span>' + t + '</span><input id="vp-' + t + '" type="number" min="0" max="30" value="0"></label>').join('') +
      '<button class="knopf haupt" type="submit">Zusage speichern</button></form>' +
      '<datalist id="traeger-liste">' + traeger.map(t => '<option value="' + esc(t) + '"></option>').join('') + '</datalist>' +
      '<details><summary>Mehrere Träger auf einmal einfügen</summary><p class="leise">Eine Zeile pro Träger: <span class="mono">Träger; RTW; KTW; NEF</span></p><textarea id="vp-import" placeholder="Kreis Gütersloh;5;0;1"></textarea><button class="knopf" data-act="vp-import">Einfügen</button></details>' +
      (ui.fzMeldung || '') + '</section>';

    // Übersicht mit Suche
    const q = (ui.fzSuche || '').toLowerCase(), fil = ui.fzFilter || 'alle';
    const passt = f => (fil === 'alle' || (fil === 'aus' ? (f.status === 'defekt' || f.status === 'abgemeldet') : f.status === fil)) &&
      (!q || (f.funkrufname + ' ' + f.kennzeichen + ' ' + C.kzNorm(f.kennzeichen) + ' ' + f.traeger + ' ' + f.typ + ' wache ' + f.wache).toLowerCase().includes(q));
    const liste = z.fahrzeuge.filter(passt).sort((a, b) => (a.wache || 99) - (b.wache || 99) || a.typ.localeCompare(b.typ) || a.nr - b.nr);
    h += '<section class="flaeche"><div class="zeile" style="justify-content:space-between"><h3>Alle Fahrzeuge</h3><span class="leise">' + liste.length + ' von ' + z.fahrzeuge.length + '</span></div>' +
      '<div class="zeile"><label class="feld" for="fz-suche" style="flex:1;min-width:200px"><span>Suchen</span><input id="fz-suche" type="search" value="' + esc(ui.fzSuche || '') + '" placeholder="Kennung, Kennzeichen oder Träger"></label>' +
      '<div class="zeile">' + FZ_FILTER.map(([v, t]) => '<button class="knopf klein" data-act="fz-filter" data-v="' + v + '" aria-pressed="' + (fil === v) + '">' + t + '</button>').join('') + '</div></div>' +
      '<div class="tabelle-box"><table><thead><tr><th>Kennung</th><th>Typ</th><th>Kennzeichen</th><th>Träger</th><th>Status</th><th>Angekommen</th></tr></thead><tbody>' +
      liste.map(f => '<tr class="' + (f.status === 'defekt' || f.status === 'abgemeldet' ? 'aus' : '') + '"><td>' + frnChip(f.funkrufname, f.wache) + (f.zusaetzlich ? ' <span class="pille warn">zusätzlich</span>' : '') + (f.ersetzt ? ' <span class="pille" title="Platz übernommen von ' + esc(f.ersetzt) + '">statt ' + esc(f.ersetzt) + '</span>' : '') + '</td><td>' + typ(f.typ) + '</td>' +
        '<td><input type="text" class="mono kz-feld" data-act="fz-kz" data-id="' + f.id + '" value="' + esc(f.kennzeichen) + '" placeholder="unbekannt" aria-label="Kennzeichen ' + esc(f.funkrufname) + '"></td><td>' + esc(f.traeger) + '</td><td>' +
        '<select data-act="fz-status" data-id="' + f.id + '" aria-label="Status ' + esc(f.funkrufname) + '">' + FZ_STATUS.map(([v, t]) => '<option value="' + v + '"' + (f.status === v ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></td><td class="mono">' + zeitKurz(f.status === 'da' && f.registriert) + '</td></tr>').join('') +
      '</tbody></table></div>' + (liste.length ? '' : '<p class="leise">Kein Fahrzeug passt zur Suche.</p>') + '</section>';
    return h;
  }

  /* ================= Ankunft am SimTag ================= */
  const ank = { text: '', gelesen: '', ocr: '', typ: 'RTW', traeger: '', ergebnis: null, kamera: null, stream: null };

  function viewAnkunft() {
    if (!Store.orga) { ui.orgaTab = 'lage'; return viewOrga(); }
    if (!voll) return '<p class="leise">Lade Daten …</p>';
    const z = voll;
    const vor = z.fahrzeuge.filter(f => !f.zusaetzlich && f.status !== 'reserve');
    const da = vor.filter(f => f.status === 'da').length;
    let h = '<div class="seitenkopf"><div><div class="eyebrow">Einfahrt</div><h1>Fahrzeug-Ankunft</h1></div><p><b>' + da + '</b> von ' + vor.length + ' zugesagten Fahrzeugen sind da' +
      (z.fahrzeuge.filter(f => f.zusaetzlich).length ? ', dazu ' + z.fahrzeuge.filter(f => f.zusaetzlich).length + ' zusätzliche' : '') + '.</p></div>';

    // Erfassen
    h += '<section class="flaeche ank-scan"><h3>Kennzeichen erfassen</h3>';
    if (ank.kamera === 'an') {
      h += '<div class="sucher"><video id="kamera-video" autoplay playsinline muted></video><div class="sucher-rahmen" aria-hidden="true"></div></div>' +
        '<div class="zeile"><button class="knopf haupt gross" data-act="kamera-foto">Erfassen</button><button class="knopf" data-act="kamera-stopp">Kamera aus</button></div>';
    } else {
      h += '<div class="zeile"><button class="knopf haupt gross" data-act="kamera-start">Kamera</button>' +
        '<label class="knopf gross" for="kz-foto">Foto<input id="kz-foto" type="file" accept="image/*" capture="environment" hidden></label></div>' +
        '<p class="leise">Kennzeichen formatfüllend und gerade aufnehmen. Ein bekanntes Fahrzeug wird sofort als „ist da“ markiert.</p>';
    }
    h += '<form id="ank-form" class="zeile" style="align-items:end"><label class="feld" for="ank-kz" style="flex:1;min-width:200px"><span>Kennzeichen (oder eintippen)</span><input id="ank-kz" type="text" class="mono" autocomplete="off" autocapitalize="characters" value="' + esc(ank.text) + '" placeholder="GT-RD 9012" style="font-size:1.3rem"></label><button class="knopf haupt" type="submit">Prüfen</button></form>' +
      (ank.ocr ? '<p class="leise" role="status">' + esc(ank.ocr) + '</p>' : '') + '</section>';

    if (ank.ergebnis) h += ankunftErgebnis(z);

    // Noch erwartet
    const tu = traegerUebersicht(z).filter(t => t.offen.length);
    h += '<section class="flaeche"><h3>Noch erwartet</h3>' + (tu.length ? '<div class="tabelle-box"><table><thead><tr><th>Träger</th><th>Fehlt noch</th></tr></thead><tbody>' +
      tu.map(t => '<tr><td>' + esc(t.traeger) + '</td><td><div class="zeile" style="gap:4px 14px">' + t.offen.map(f => '<span title="' + esc(f.typ + (f.kennzeichen ? ' ' + f.kennzeichen : '')) + '">' + frnChip(f.funkrufname, f.wache) + '</span>').join('') + '</div></td></tr>').join('') + '</tbody></table></div>'
      : '<p>Alle zugesagten Fahrzeuge sind da.</p>') + '</section>';
    return h;

  async function ankunftPruefen(text, gelesen) {
    ank.text = text; ank.traeger = ''; ank.ergebnis = null;
    if (!C.kzNorm(text)) { ank.ocr = 'Kein Kennzeichen erkannt. Bitte eintippen.'; return render(); }
    const z = await Store.voll();
    const t = C.fahrzeugZuKennzeichen(z, text);
    if (t) {
      const f = t.fahrzeug;
      if (f.status === 'da' || f.status === 'reserve') { ank.ergebnis = { art: 'fertig', fid: f.id, schonDa: true, gelesen: gelesen || text }; await neu(); return; }
      await Store.aendern(zz => C.ankunftBestaetigen(zz, { art: 'treffer', fid: f.id }));
      ank.ergebnis = { art: 'fertig', fid: f.id, gelesen: gelesen || text, vorher: f.status };
      ank.ocr = ''; await neu(); return;
    }
    ank.ergebnis = { art: 'unbekannt', kennzeichen: text };
    await neu();
  }

  /* ---- Kamera und Texterkennung (Tesseract, liegt auf dem eigenen Server) ---- */
  let ocrWorker = null;
  function skriptLaden(src) {
    return new Promise((ok, nein) => { if (window.Tesseract) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = nein; document.head.appendChild(s); });
  }
  async function ocrBereit() {
    if (ocrWorker) return ocrWorker;
    const basis = new URL('vendor/ocr/', document.baseURI).href;
    await skriptLaden(basis + 'tesseract.min.js');
    ocrWorker = await window.Tesseract.createWorker('eng', 1, { workerPath: basis + 'worker.min.js', corePath: basis, langPath: basis.replace(/\/$/, ''), gzip: true, workerBlobURL: false });
    await ocrWorker.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ', preserve_interword_spaces: '1' });
    return ocrWorker;
  }

  function aufbereiten(quelle, sw, sh, ausschnitt) {
    // Ausschnitt [x,y,b,h] in Anteilen; Graustufen und Kontrast strecken, auf ~1400 px Breite skalieren
    const [ax, ay, ab, ah] = ausschnitt || [0, 0, 1, 1];
    const bx = sw * ax, by = sh * ay, bb = sw * ab, bh = sh * ah;
    const f = Math.min(3, 1400 / bb);
    const c = document.createElement('canvas'); c.width = Math.round(bb * f); c.height = Math.round(bh * f);
    const g = c.getContext('2d'); g.drawImage(quelle, bx, by, bb, bh, 0, 0, c.width, c.height);
    const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
    let min = 255, max = 0;
    for (let i = 0; i < p.length; i += 4) { const v = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; p[i] = v; if (v < min) min = v; if (v > max) max = v; }
    const sp = Math.max(1, max - min);
    for (let i = 0; i < p.length; i += 4) { const v = (p[i] - min) * 255 / sp; p[i] = p[i + 1] = p[i + 2] = v; }
    g.putImageData(d, 0, 0);
    return c;
  }

  const KZ_MUSTER = /\b([A-ZÄÖÜ]{1,3})[\s-]+([A-Z]{1,2})[\s-]*(\d{1,4})\s?([EH]?)\b/;
  function besterTreffer(texte) {
    const z = voll;
    const zeilen = texte.flatMap(t => String(t || '').toUpperCase().split(/\n/)).map(t => t.replace(/[^A-Z0-9ÄÖÜ\- ]/g, ' ').replace(/\s+/g, ' ').trim()).filter(t => t.length >= 4);
    for (const zl of zeilen) { const t = z && C.fahrzeugZuKennzeichen(z, zl); if (t) return zl; }
    for (const zl of zeilen) { const m = zl.match(KZ_MUSTER); if (m) return m[1] + '-' + m[2] + ' ' + m[3] + m[4]; }
    return zeilen.sort((a, b) => b.length - a.length)[0] || '';
  }

  async function erkennen(bild, sw, sh, nurRahmen) {
    ank.ocr = 'Erkenne Kennzeichen …'; ank.ergebnis = null; render();
    try {
      const w = await ocrBereit();
      const texte = [];
      if (nurRahmen) {
        texte.push((await w.recognize(aufbereiten(bild, sw, sh, [0.1, 0.39, 0.8, 0.22]), { tessedit_pageseg_mode: '7' })).data.text);
      } else {
        texte.push((await w.recognize(aufbereiten(bild, sw, sh, [0.05, 0.3, 0.9, 0.4]))).data.text);
        if (!C.kzNorm(besterTreffer(texte))) texte.push((await w.recognize(aufbereiten(bild, sw, sh))).data.text);
      }
      const kzText = besterTreffer(texte);
      ank.ocr = kzText ? 'Gelesen: ' + kzText : 'Kein Kennzeichen erkannt. Bitte näher ran oder eintippen.';
      if (kzText) await ankunftPruefen(kzText, kzText); else render();
    } catch (e) {
      ank.ocr = 'Die Texterkennung ist hier nicht verfügbar. Bitte das Kennzeichen eintippen.'; render();
    }
  }

    try {
      ank.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });

    }
