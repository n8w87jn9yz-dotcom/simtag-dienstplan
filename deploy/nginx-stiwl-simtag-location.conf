# Variante „Unterordner“: in den bestehenden 443-Server-Block von stiwl.szenarioheld.de
# (sites-available/szenarioheld-stiwl) einfügen. SiMon stiwl bleibt unverändert.
# Basic-Auth gilt hier nicht, weil Azubis ohne Zugangsdaten auf Plan und Anmeldung kommen müssen.
# Die App schützt Namen selbst (Zugangsschlüssel im Link, Orga-Passwort).

location = /simtag { return 301 /simtag/$is_args$args; }

location /simtag/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 8m;
}

# Live-Aktualisierung (Server-Sent Events) ohne Puffer
location /simtag/api/events {
    auth_basic off;
    proxy_pass http://127.0.0.1:8097/api/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
